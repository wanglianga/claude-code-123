# MySQL 生产/联调 profile，启动方式：
# java -jar mediation-platform.jar --spring.profiles.active=mysql \
#   --spring.datasource.url='jdbc:mysql://localhost:3306/mediation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai' \
#   --spring.datasource.username=root --spring.datasource.password=你的密码
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mediation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
